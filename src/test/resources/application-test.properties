# Perfil de tests. Sin tildes a proposito: java.util.Properties no garantiza
# UTF-8 y un acento se corrompe callado.

# La conexion real la inyecta @ServiceConnection desde el contenedor de MySQL.
# Estos valores solo existen para que resuelvan los placeholders sin default de
# application.properties; si faltan, el contexto ni siquiera arranca.
spring.datasource.url=jdbc:mysql://localhost:3306/placeholder
spring.datasource.username=placeholder
spring.datasource.password=placeholder

# El proyecto todavia no usa Flyway, asi que el esquema de los tests lo genera
# Hibernate y se descarta al terminar. Cuando entre Flyway, esto pasa a "none" y
# las migraciones se aplican solas sobre el contenedor.
spring.jpa.hibernate.ddl-auto=create-drop

# Sin esto, spring-boot-docker-compose intenta levantar el compose.yaml del repo
# y los tests terminan escribiendo en la base de desarrollo.
spring.docker.compose.enabled=false

# Clave solo de test, no sirve para ningun entorno real.
jwt.secret=dGVzdC1zZWNyZXQta2V5LWNvbi1sYXJnby1zdWZpY2llbnRlLXBhcmEtaG1hYy0yNTY=
jwt.expiration-ms=1800000

google.books.api.key=clave-de-test

app.security.trust-proxy=false

logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
