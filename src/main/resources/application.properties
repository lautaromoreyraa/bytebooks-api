spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?connectionTimeZone=UTC&characterEncoding=UTF-8&connectTimeout=10000
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.keepalive-time=300000

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

google.books.api.key=${GOOGLE_BOOKS_API_KEY}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.carpeta=${CLOUDINARY_CARPETA:bytebooks}

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

server.port=${PORT:8080}
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:20}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

app.security.trust-proxy=${APP_SECURITY_TRUST_PROXY:false}
app.cors.origenes=${CORS_ORIGENES:http://localhost:5173}
app.turnstile.clave-secreta=${TURNSTILE_CLAVE_SECRETA}
app.turnstile.url=https://challenges.cloudflare.com/turnstile/v0/siteverify

logging.level.org.springframework.boot.context.config=INFO
logging.level.com.zaxxer.hikari=INFO
