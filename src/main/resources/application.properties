# ===========================
# Base de datos
# ===========================
# connectionTimeZone: el driver interpreta los DATETIME en UTC, igual que el
# servidor. Sin esto usa la zona de la JVM y las fechas se corren.
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?connectionTimeZone=UTC&characterEncoding=UTF-8&connectTimeout=10000
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Cada conexion abierta ocupa memoria en la API y en MySQL; el default de
# Hikari (10) le sobra a este trafico. La MySQL de Railway es compartida por
# cinco APIs: cada conexion ociosa cuenta contra su max_connections, por eso el
# minimo es 1 y no igual al maximo.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
# Si la base no responde, fallar en 10 s y no colgar el request 30.
spring.datasource.hikari.connection-timeout=10000
# Menor que el wait_timeout de MySQL: Hikari recicla la conexion antes de que
# el servidor la corte por su cuenta.
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.keepalive-time=300000

# Flyway es el unico dueno del esquema: Hibernate no crea ni toca tablas. Un
# update al renombrar un campo deja la columna vieja con datos y la nueva
# vacia, sin avisar.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# La base de produccion ya existia, creada por ddl-auto=update: V1 describe
# ese estado. En una base con tablas y sin historial, Flyway marca V1 como
# aplicada en lugar de intentar crearlas. En una base vacia corre V1 normal.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Lo que falta cargar falla en el repositorio y no despues en un controller.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===========================
# JWT
# ===========================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

# ===========================
# Google Books
# ===========================
google.books.api.key=${GOOGLE_BOOKS_API_KEY}

# ===========================
# Upload de archivos
# ===========================
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# ===========================
# Servidor
# ===========================
server.port=${PORT:8080}
# Tomcat arranca con hasta 200 hilos y cada uno reserva su pila; con 20 se
# atiende el trafico del sitio y el consumo de memoria queda acotado.
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:20}
# Cada redeploy manda SIGTERM: se terminan los requests en curso antes de
# cerrar. Es el default desde Boot 3.4; queda escrito para no depender de eso.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ===========================
# Salud (la consulta Railway)
# ===========================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# ===========================
# Seguridad
# ===========================
app.security.trust-proxy=${APP_SECURITY_TRUST_PROXY:false}

# ===========================
# Logs
# ===========================
logging.level.org.springframework.boot.context.config=INFO
logging.level.com.zaxxer.hikari=INFO
